[server]
# Selkies server configuration
port = 8080
secure = false
# enable_gpu_encoding = true
# video_encoder = h264_nvenc
# audio_encoder = opus
# target_fps = 60
# video_bitrate = 8000
# audio_bitrate = 128
# pointer_timeout = 5
# cursor = true
# clipboard = true
# web_audio = true
# debug = false

[network]
# Network configuration for low latency
# stun_servers = stun.l.google.com:19302,stun1.l.google.com:19302
# turn_servers =
# ice_transport_policy = all
# bundle_policy = max-bundle
# rtcp_mux_policy = require

[video]
# Video encoding settings for NVENC
# codec = h264
# preset = llhq
# tune = ull
# profile = high
# rc = cbr
# bitrate = 8000
# max_bitrate = 12000
# buffer_size = 8000
# gop = 60
# b_frames = 0
# aq = true
# aq_strength = 8
# lookahead = 0
# spatial_aq = true
# temporal_aq = true
# psnr = false
# ssim = false

[audio]
# Audio encoding settings
# codec = opus
# bitrate = 128
# complexity = 10
# signal = music
# application = audio
# frame_size = 20
